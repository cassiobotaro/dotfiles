# Fonte (Nerd Font instalada pelo install.sh) com ligaturas
font_family       FiraCode Nerd Font Mono
font_size         12
disable_ligatures never

# Comportamento
enable_audio_bell       no
confirm_os_window_close 0
scrollback_lines        50000
copy_on_select          no
# no-title: o título fica só com o que os programas definem, como no VTE
shell_integration       enabled no-title
# o kitty desenha a própria barra de título no Wayland/GNOME
wayland_titlebar_color  background

# Abas no topo estilo GNOME Console: largura igual, título centralizado e a
# aba ativa numa pílula arredondada (desenhada por kitty_tab_bar.py)
tab_bar_edge top
tab_bar_style custom
tab_bar_margin_width  4
tab_bar_margin_height 4 4
tab_title_template "{title}"
tab_bar_background      #000000
active_tab_foreground   #ffffff
active_tab_background   #242424
active_tab_font_style   normal
inactive_tab_foreground #bdbdbd
inactive_tab_background #000000

# Splits (substitui os panes do tmux); stack = zoom do split atual
enabled_layouts splits,stack
# bordas em cinza, combinando com as abas
active_border_color   #4a4a4a
inactive_border_color #1a1a1a
# escurece o texto dos splits sem foco
inactive_text_alpha   0.7

# kitty_mod = ctrl+shift
# splits, abas e janelas novas abrem na pasta atual
map kitty_mod+\     launch --location=vsplit --cwd=current
map kitty_mod+minus launch --location=hsplit --cwd=current
map kitty_mod+enter launch --location=split --cwd=current
map kitty_mod+t     new_tab_with_cwd
map kitty_mod+n     new_os_window_with_cwd
map kitty_mod+z     toggle_layout stack

# navegar entre splits estilo vim
map kitty_mod+h neighboring_window left
map kitty_mod+j neighboring_window down
map kitty_mod+k neighboring_window up
map kitty_mod+l neighboring_window right

# redimensionar splits estilo vim
map ctrl+alt+h resize_window narrower 5
map ctrl+alt+l resize_window wider 5
map ctrl+alt+k resize_window taller 5
map ctrl+alt+j resize_window shorter 5

# ir direto para a aba N (ctrl+shift+1..9)
map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5
map kitty_mod+6 goto_tab 6
map kitty_mod+7 goto_tab 7
map kitty_mod+8 goto_tab 8
map kitty_mod+9 goto_tab 9

# scrollback no pager (kitty_mod+h ficou para a navegação)
map kitty_mod+space show_scrollback

# recarregar config
map kitty_mod+f5 load_config_file

# tema/cores: `kitten themes` grava em current-theme.conf
include current-theme.conf
